name: Update xG Database Automatically

on:
  schedule:
    # Esegue lo script ogni Martedi (2) e Venerdi (5) alle 06:00 UTC (08:00 italiane)
    - cron: '0 6 * * 2,5'
  workflow_dispatch: # Permette anche l'esecuzione manuale con un click da GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install soccerdata requests

      - name: Run update script
        run: |
          python update_all_xg_db.py

      - name: Commit and push updated JSONs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add SoccerMath/database/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: aggiornamento archivio xG campionati (Understat)" && git push)
