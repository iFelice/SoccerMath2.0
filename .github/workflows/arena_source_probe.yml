name: Arena source connectivity probe
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/arena_source_probe.yml']
permissions:
  contents: read
jobs:
  sofascore:
    name: SofaScore JSON access
    runs-on: ubuntu-latest
    steps:
      - name: Probe status only
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, sys
          urls = ['https://api.sofascore.com/api/v1/event/11930405', 'https://api.sofascore.com/api/v1/team/17/injuries', 'https://www.sofascore.com/api/v1/event/16275102/lineups']
          failed = 0
          for u in urls:
            try:
              req=urllib.request.Request(u, headers={'Accept':'application/json','User-Agent':'Arena-source-probe/1.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                print(f'HTTP {r.status} {u}')
                if r.status != 200: failed += 1
            except urllib.error.HTTPError as e:
              print(f'HTTP {e.code} {u}')
              failed += 1
            except Exception as e:
              print(f'NETWORK_ERROR {type(e).__name__} {u}')
              failed += 1
          sys.exit(1 if failed else 0)
          PY
  fotmob:
    name: FotMob JSON access
    runs-on: ubuntu-latest
    steps:
      - name: Probe status only
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, sys
          urls = ['https://www.fotmob.com/api/data/matchDetails?matchId=3901262', 'https://www.fotmob.com/api/data/leagueseasondeepstats?id=47']
          failed = 0
          for u in urls:
            try:
              req=urllib.request.Request(u, headers={'Accept':'application/json','User-Agent':'Arena-source-probe/1.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                print(f'HTTP {r.status} {u}')
                if r.status != 200: failed += 1
            except urllib.error.HTTPError as e:
              print(f'HTTP {e.code} {u}')
              failed += 1
            except Exception as e:
              print(f'NETWORK_ERROR {type(e).__name__} {u}')
              failed += 1
          sys.exit(1 if failed else 0)
          PY
