name: Arena source connectivity probe
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/arena_source_probe.yml']
permissions:
  contents: read
jobs:
  sofascore:
    name: SofaScore ${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: event
            url: https://api.sofascore.com/api/v1/event/11930405
          - id: injuries
            url: https://api.sofascore.com/api/v1/team/17/injuries
          - id: lineups
            url: https://www.sofascore.com/api/v1/event/16275102/lineups
    steps:
      - name: Probe status only
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, sys
          u='${{ matrix.url }}'
          try:
            req=urllib.request.Request(u, headers={'Accept':'application/json','User-Agent':'Arena-source-probe/1.0'})
            with urllib.request.urlopen(req, timeout=30) as r:
              print(f'HTTP {r.status} {u}')
              sys.exit(0 if r.status == 200 else 1)
          except urllib.error.HTTPError as e:
            print(f'HTTP {e.code} {u}')
            sys.exit(1)
          except Exception as e:
            print(f'NETWORK_ERROR {type(e).__name__} {u}')
            sys.exit(1)
          PY
  fotmob:
    name: FotMob ${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: matchDetails
            url: https://www.fotmob.com/api/data/matchDetails?matchId=3901262
          - id: leagueSeasons
            url: https://www.fotmob.com/api/data/leagueseasondeepstats?id=47
    steps:
      - name: Probe status only
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, sys
          u='${{ matrix.url }}'
          try:
            req=urllib.request.Request(u, headers={'Accept':'application/json','User-Agent':'Arena-source-probe/1.0'})
            with urllib.request.urlopen(req, timeout=30) as r:
              print(f'HTTP {r.status} {u}')
              sys.exit(0 if r.status == 200 else 1)
          except urllib.error.HTTPError as e:
            print(f'HTTP {e.code} {u}')
            sys.exit(1)
          except Exception as e:
            print(f'NETWORK_ERROR {type(e).__name__} {u}')
            sys.exit(1)
          PY
