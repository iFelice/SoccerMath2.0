name: Suite test completa

# Esegue TUTTI i test tracciati del repository, non solo i sottoinsiemi che
# girano gia' in "Audit Top Mix" e "Replay Top Mix legacy":
#
#   1. pytest su ogni file test_*.py tracciato, tranne SoccerMath/test_theme_toggle.py
#      (l'elenco si ricava da `git ls-files`: un test nuovo entra da solo);
#   2. SoccerMath/test_theme_toggle.py eseguito come script: non e' un test pytest
#      (fa asserzioni a livello di modulo e chiude con sys.exit(0)).
#
# I DUE GRUPPI DEL CENSIMENTO
# (audit/results/referto_fixture_apptest_giornata7_2026-11-02.md, punto 4):
#
#   * GRUPPO 1 - test del codice che leggevano per sbaglio dati vivi (voci 1, 2,
#     3, 5, 8, 11, 12, 13): restano QUI, resi indipendenti con la copia congelata
#     SoccerMath/test_fixtures/db_congelato/2026-10-29 e con l'orologio fermo
#     (SoccerMath/test_snapshot_congelato.py). Nessuna asserzione cambiata.
#
#   * GRUPPO 2 - controlli sui DATI VERI (voci 4, 6, 7, 9, 10): NON stanno qui.
#     Devono continuare a leggere i file vivi, quindi non si congelano: girano in
#     .github/workflows/controlli_dati.yml (SM_CONTROLLI_DATI=1), ogni giorno dopo
#     live_odds.yml e update_database.yml. Nel loro file d'origine sono saltati con
#     il motivo scritto (vedi il passo "Gruppo 2: elenco dei test esclusi"): la
#     suite continua a raccoglierli, ma non li esegue. Con SM_CONTROLLI_DATI=0
#     impostato qui sotto l'esclusione non dipende dall'ambiente del runner.
#
#     file/classi escluse:
#       SoccerMath/test_season_rosters.py::TestValidazioneETolleranza
#       SoccerMath/test_season_rosters.py::TestControlloLiveCsv
#       SoccerMath/test_alias_quote_live.py (TestCoperturaFileLive,
#           TestCoperturaCalendariFootballData, TestAliasAggiunti::test_i_canonici_*)
#       audit/test_live_odds_match.py (4 test dell'abbinamento sui CSV vivi)
#       audit/test_ng_regression.py (TestNameMapping::test_current_season_teams_covered,
#           TestNgRange::test_all_leagues_no_extreme_ng)
#       SoccerMath/test_controlli_dati.py (per intero: e' il file del gruppo 2)
#
# Sola lettura: nessun commit, nessun push, nessun secret, nessuna scrittura nel Registro.
#
# Trigger:
#   - pull_request verso main: si salta SOLO se tutti i file modificati sono
#     documentazione (docs/ o *.md), stessa regola di Audit e Replay;
#   - schedule ogni giorno alle 13:37 UTC (cron '37 13 * * *'), su main. Il run
#     schedulato non si salta mai. GitHub puo' ritardare i cron: l'orario e'
#     nominale, non garantito;
#   - workflow_dispatch.
#   Nessun trigger push: la suite completa non gira sui push dei branch arena/**;
#   la verifica di un branch e' la sua pull request verso main.

on:
  pull_request:
    branches:
      - main
  schedule:
    # 13:37 UTC: nei run schedulati osservati di update_database, update_xg e
    # snapshot_registro non c'e' nessuna partenza tra le 12:47 e le 14:03 UTC.
    - cron: '37 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-suite-${{ github.ref }}
  # Su PR vale solo l'ultimo commit: il run precedente si annulla.
  # Il run schedulato su main non viene mai annullato.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  suite:
    name: Suite completa (pytest + test_theme_toggle)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      REPORT_DIR: ${{ github.workspace }}/suite-out
      # Esplicito: i test del gruppo 2 restano saltati. A eseguirli e' solo
      # .github/workflows/controlli_dati.yml, che imposta la variabile a 1.
      SM_CONTROLLI_DATI: "0"

    steps:
      # fetch-depth: 0 come negli altri workflow: alcuni test leggono la storia git
      # (blob/commit) e il passo "Salta?" confronta con la base della PR.
      - name: Checkout (storia completa)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Salta? (solo documentazione; mai per schedule e dispatch)
        id: salta
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENTO" != "pull_request" ]; then
            echo "Evento $EVENTO: si esegue sempre"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CAMBIATI=$(git diff --name-only "$BASE_SHA" HEAD)
          printf '%s\n' "$CAMBIATI"
          if [ -n "$CAMBIATI" ] && printf '%s\n' "$CAMBIATI" | grep -qEv '(^docs/|\.md$)'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$CAMBIATI" ]; then
            echo "Tutti i file modificati sono documentazione: salto la suite"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nessun file rilevato: eseguo per sicurezza"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.salta.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Stesso ambiente di Audit e Replay.
      - name: Dipendenze
        if: steps.salta.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r SoccerMath/requirements.txt -r requirements-audit.txt pytest

      # Solo informativa: non decide nulla e non fa fallire il job. Registra CPU, flag SIMD, glibc e
      # versioni numeriche del runner, per confrontare i run che passano con quelli che falliscono
      # sui due test a tolleranza 1e-12 (ipotesi: differenze di 1 ULP fra hardware diversi).
      - name: Diagnostica del runner (solo informativa)
        if: steps.salta.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p "$REPORT_DIR"
          CPU=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs || true)
          FLAGS=$(grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx2|fma|avx512f|avx512_vnni|avx512_bf16|avx512_fp16|amx_tile)$' | tr '\n' ' ' | xargs || true)
          LIBC=$(ldd --version 2>&1 | head -n 1 || true)
          VERS=$(python -c "import platform, numpy, scipy; print(f'python {platform.python_version()}, numpy {numpy.__version__}, scipy {scipy.__version__}')" 2>&1 || echo "versioni non disponibili")
          {
            echo "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "host: $(hostname)"
            echo "cpu: ${CPU:-n/d}"
            echo "flag SIMD: ${FLAGS:-nessuno}"
            echo "libc: ${LIBC}"
            echo "librerie: ${VERS}"
            echo "--- numpy.show_runtime():"
            python -c "import numpy; numpy.show_runtime()" 2>&1 || true
          } > "$REPORT_DIR/runner-diag.txt"
          echo "::notice title=Diagnostica runner::cpu=${CPU:-n/d}; flag SIMD=${FLAGS:-nessuno}; ${LIBC}; ${VERS}"
          {
            echo "## Diagnostica del runner (informativa)"
            echo ""
            echo "- CPU: ${CPU:-n/d}"
            echo "- flag SIMD: ${FLAGS:-nessuno}"
            echo "- libc: ${LIBC}"
            echo "- librerie: ${VERS}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Elenco dei file di test (test_*.py tracciati, meno test_theme_toggle.py)
        if: steps.salta.outputs.skip != 'true'
        run: |
          mkdir -p "$REPORT_DIR"
          git ls-files | grep -E '(^|/)test_[^/]*\.py$' | grep -vx 'SoccerMath/test_theme_toggle.py' > "$REPORT_DIR/file_pytest.txt"
          echo "File per pytest: $(wc -l < "$REPORT_DIR/file_pytest.txt")"
          cat "$REPORT_DIR/file_pytest.txt"

      # Trasparenza: quali test la suite raccoglie ma NON esegue, e perche'.
      # Sono quelli del gruppo 2 (dati veri) piu' i test saltati per altri motivi.
      # Solo informativa: non decide nulla.
      - name: "Gruppo 2 - elenco dei test esclusi (solo informativa)"
        if: steps.salta.outputs.skip != 'true'
        shell: bash
        env:
          SM_CONTROLLI_DATI: "0"
        run: |
          mkdir -p "$REPORT_DIR"
          python - > "$REPORT_DIR/gruppo2-esclusi.txt" <<'PY'
          import ast, os

          FILE = [
              "SoccerMath/test_season_rosters.py",
              "SoccerMath/test_alias_quote_live.py",
              "audit/test_live_odds_match.py",
              "audit/test_ng_regression.py",
              "SoccerMath/test_controlli_dati.py",
          ]

          def decoratori(node):
              return [ast.unparse(d) for d in getattr(node, "decorator_list", [])]

          def gruppo_2(node):
              return any("CONTROLLI_DATI" in d for d in decoratori(node))

          print("Test del gruppo 2 (dati veri) raccolti ma saltati da questa suite;")
          print("li esegue .github/workflows/controlli_dati.yml con SM_CONTROLLI_DATI=1.")
          print()
          totale = 0
          for percorso in FILE:
              if not os.path.exists(percorso):
                  print(f"{percorso}: ASSENTE")
                  continue
              with open(percorso, encoding="utf-8") as fh:
                  albero = ast.parse(fh.read(), filename=percorso)
              righe = []
              classi_escluse = {n.name for n in albero.body
                                if isinstance(n, ast.ClassDef) and gruppo_2(n)}
              for nodo in albero.body:
                  if isinstance(nodo, ast.ClassDef):
                      if nodo.name in classi_escluse:
                          righe.append((nodo.name, "(classe intera)", nodo.lineno))
                      for figlio in nodo.body:
                          if isinstance(figlio, (ast.FunctionDef, ast.AsyncFunctionDef)) \
                                  and gruppo_2(figlio):
                              righe.append((nodo.name, figlio.name, figlio.lineno))
                  elif isinstance(nodo, (ast.FunctionDef, ast.AsyncFunctionDef)) and gruppo_2(nodo):
                      righe.append(("", nodo.name, nodo.lineno))
              totale += len(righe)
              print(f"{percorso}: {len(righe)} test esclusi")
              for classe, nome, riga in righe:
                  dove = f"{classe}::{nome}" if classe else nome
                  print(f"  riga {riga:>5}  {dove}")
          print()
          print(f"totale esclusi: {totale}")
          PY
          cat "$REPORT_DIR/gruppo2-esclusi.txt"
          {
            echo "### Gruppo 2 escluso dalla suite (dati veri)"
            echo ""
            echo '```'
            cat "$REPORT_DIR/gruppo2-esclusi.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Nessun `continue-on-error`, nessun `|| true`: un test fallito fa fallire il passo e il job.
      - name: Suite pytest (tutti i file test_*.py tracciati)
        id: pytest
        if: steps.salta.outputs.skip != 'true'
        shell: bash
        run: |
          set -o pipefail
          mapfile -t FILES < "$REPORT_DIR/file_pytest.txt"
          python -m pytest -q -rfE --tb=short -p no:cacheprovider \
            --junitxml="$REPORT_DIR/pytest-junit.xml" --durations=15 \
            "${FILES[@]}" 2>&1 | tee "$REPORT_DIR/pytest.log"

      # Eseguito anche se pytest e' fallito, cosi' l'esito dei due controlli e' sempre visibile.
      - name: test_theme_toggle.py (come script, non da pytest)
        id: theme
        if: always() && steps.salta.outputs.skip != 'true'
        shell: bash
        run: |
          set -o pipefail
          python SoccerMath/test_theme_toggle.py 2>&1 | tee "$REPORT_DIR/theme_toggle.log"

      - name: Riepilogo e annotazioni (sempre)
        if: always() && steps.salta.outputs.skip != 'true'
        shell: bash
        env:
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          THEME_OUTCOME: ${{ steps.theme.outcome }}
          RUN_SHA: ${{ github.sha }}
          RUN_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET

          out = os.environ["REPORT_DIR"]
          files = [l.strip() for l in open(os.path.join(out, "file_pytest.txt"), encoding="utf-8") if l.strip()]
          # classname di pytest = modulo puntato, es. SoccerMath.test_x.TestY -> SoccerMath/test_x.py
          mod2file = {f[:-3].replace("/", "."): f for f in files}

          def file_of(classname):
              best = None
              for mod, f in mod2file.items():
                  if classname == mod or classname.startswith(mod + "."):
                      if best is None or len(mod) > len(best[0]):
                          best = (mod, f)
              return best[1] if best else "?"

          def esc_ann(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def esc_md(s):
              return s.replace("|", "\\|").replace("\n", " ")[:300]

          tot = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          secs = 0.0
          n_cases = n_sub = 0
          fails, timings = [], []
          junit = os.path.join(out, "pytest-junit.xml")
          if os.path.exists(junit):
              root = ET.parse(junit).getroot()
              for ts in root.iter("testsuite"):
                  for k in tot:
                      tot[k] += int(ts.get(k, 0))
                  secs += float(ts.get("time", 0))
              # l'attributo "tests" di JUnit conta anche i subtest: li separiamo dai casi
              n_cases = sum(1 for _ in root.iter("testcase"))
              n_sub = tot["tests"] - n_cases
              for tc in root.iter("testcase"):
                  timings.append((float(tc.get("time", 0)), tc.get("classname"), tc.get("name")))
                  el = None
                  for tag in ("failure", "error"):
                      x = tc.find(tag)
                      if x is not None:
                          el = x
                          break
                  if el is not None:
                      msg = (el.get("message") or "").strip()
                      fails.append((tc.get("classname"), tc.get("name"), file_of(tc.get("classname")), msg))

          for cls, name, f, msg in fails:
              first = msg.splitlines()[0][:300] if msg else "(nessun messaggio)"
              print(f"::error file={f},title=test fallito::{esc_ann(cls + '::' + name + ' - ' + first)}")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write("## Suite test completa\n\n")
              s.write(f"- evento: `{os.environ['RUN_EVENT']}`, commit: `{os.environ['RUN_SHA']}`\n")
              s.write(f"- pytest (tutti i file tracciati): **{os.environ['PYTEST_OUTCOME']}**\n")
              s.write(f"- test_theme_toggle.py (script): **{os.environ['THEME_OUTCOME']}**\n")
              s.write(f"- casi di test: {n_cases}, subtest: {n_sub}, falliti: {tot['failures']}, errori: {tot['errors']}, saltati: {tot['skipped']}, tempo pytest: {secs:.1f} s\n\n")
              if fails:
                  s.write("### Test falliti\n\n| file | test | messaggio |\n|---|---|---|\n")
                  for cls, name, f, msg in fails[:100]:
                      s.write(f"| `{f}` | `{esc_md(name)}` | {esc_md(msg)} |\n")
                  s.write("\n")
              s.write("### 10 test piu' lenti\n\n| secondi | test |\n|---|---|\n")
              for t, cls, name in sorted(timings, reverse=True)[:10]:
                  s.write(f"| {t:.2f} | `{esc_md(cls + '::' + name)}` |\n")

          print(f"pytest: casi={n_cases} subtest={n_sub} failures={tot['failures']} errors={tot['errors']} skipped={tot['skipped']} secs={secs:.1f}")
          PY

      - name: Report come artifact
        if: always() && steps.salta.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: suite-test-${{ github.run_id }}
          path: suite-out/
          if-no-files-found: warn
          retention-days: 14
