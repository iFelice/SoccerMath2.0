name: Estrazione referto (temporaneo)

# Workflow DI SERVIZIO, temporaneo: non fa parte della verifica e viene rimosso
# subito dopo l'uso. Serve solo a spostare i file prodotti dal run di verifica
# (referto markdown + JSON) dall'artifact all'API GitHub, perche' l'ambiente da
# cui si legge non puo' scaricare gli artifact. Sola lettura: contents: read,
# nessun commit, nessun push, nessun segreto.
on:
  push:
    paths:
      - estrazione-referto.txt

permissions:
  contents: read

jobs:
  estrai:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica l'artifact del run indicato
        uses: actions/download-artifact@v4
        with:
          name: ppda-player-verify-34992936842
          run-id: 34992936842
          github-token: ${{ github.token }}
          path: art

      - name: Contenuto dell'artifact
        run: |
          find art -maxdepth 3 | head -40

      - name: Emetti i file prodotti come annotazioni
        run: |
          python - <<'PY'
          import base64
          import glob
          import hashlib
          import lzma
          import os
          import sys

          CHUNK = 6000
          paths = sorted(glob.glob("art/**/ppda_deep_player_feasibility.*", recursive=True))
          if not paths:
              print("referto non trovato nell'artifact")
              for root, dirs, names in os.walk("art"):
                  print(root, sorted(names)[:8])
              sys.exit(1)

          for path in paths:
              name = os.path.basename(path)
              data = open(path, "rb").read()
              digest = hashlib.sha256(data).hexdigest()
              payload = base64.b64encode(lzma.compress(data, preset=9)).decode()
              print(f"::{('warning' if name.endswith('.json') else 'notice')} "
                    f"title=sha256-{name}::{name} {len(data)} {digest}")
              for index in range(0, len(payload), CHUNK):
                  part = payload[index:index + CHUNK]
                  number = index // CHUNK + 1
                  kind = "warning" if name.endswith(".json") else "notice"
                  print(f"::{kind} title={name}-{number:02d}::{part}")
              print(f"{name}: {len(data)} byte, {len(payload)} caratteri base64")
          PY
