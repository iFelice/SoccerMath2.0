name: Aggiorna Database

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Stesso gruppo di update_xg.yml: entrambi committano dati sullo stesso branch.
# live_odds.yml NON e' piu' in questo gruppo (2026-10-10): con un gruppo
# condiviso i cron delle quote finivano in coda, e GitHub cancella ogni run
# PRECEDENTEMENTE in attesa nel gruppo non appena ne arriva un'altra (anche con
# cancel-in-progress: false, che protegge solo i run IN CORSO). Le quote hanno
# ora il gruppo dedicato soccermath-quote; il push resta protetto dal retry
# con rebase di entrambi i workflow.
concurrency:
  group: soccermath-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SoccerMath
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check API key
        run: |
          if [ -z "${{ secrets.FOOTBALL_DATA_API_KEY }}" ]; then
            echo "::error::FOOTBALL_DATA_API_KEY mancante. Aggiungila in Settings → Secrets."
            exit 1
          fi
          echo "API key presente."
          
      - name: Archivia stagione precedente (rollover)
        run: python season_rollover.py
      
      - name: Update live database
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python update_db.py

      # Roster della stagione corrente (season_rosters.json, salvato da
      # update_db.py dal calendario API prima dello scarto delle non giocate):
      # dopo il 15 luglio deve esserci ed essere completo (20 squadre, 18 per
      # Bundesliga e Ligue 1), altrimenti il job fallisce con errore esplicito
      # invece di girare senza seed Elo. Prima del termine l'assenza e'
      # ammessa (calendario non ancora pubblicato: stessa logica della
      # tolleranza pre-stagione della PR #27; calendari 2026/27 pubblicati a
      # giugno, primo kickoff mai prima del 05/08). Il controllo e' anche
      # dentro update_db.py: questo passo lo rende esplicito nel workflow.
      - name: Verifica roster stagione corrente
        run: python season_rosters.py --check

      # Lo scraping xG NON avviene piu' qui: l'unica acquisizione Understat e'
      # .github/workflows/update_xg.yml (update_all_xg_db.py + update_xg.py).
      # Lasciarlo qui significava un secondo download, con uno snapshot diverso
      # da quello dell'archivio e medie incoerenti fra loro.

      - name: Commit e push (con retry se main si muove)
        working-directory: ${{ github.workspace }}
        run: |
          set -uo pipefail
          BRANCH="${{ github.ref_name }}"
          git config --global user.name "M4 Bot"
          git config --global user.email "action@github.com"
          git add -A -- 'SoccerMath/database/*.csv' 'SoccerMath/database/season_rosters.json'
          if git diff --cached --quiet; then
            echo "Nessun cambiamento: niente da committare."
            exit 0
          fi
          git commit -m "Auto-update live data $(date -u +%Y-%m-%dT%H:%M)Z"
          for i in 1 2 3 4; do
            if git push -q origin "HEAD:$BRANCH"; then
              echo "Push ok."
              exit 0
            fi
            echo "Push rifiutato (main avanti): rebase e riprovo ($i/4)"
            git fetch -q origin "$BRANCH"
            if ! git rebase -q "origin/$BRANCH"; then
              git rebase --abort
              echo "::error::Conflitto sui CSV, serve intervento manuale"
              exit 1
            fi
            sleep $((i * 8))
          done
          echo "::error::Push non riuscito dopo 4 tentativi"
          exit 1

  # Allarme QUOTE VECCHIE (2026-10-10): job SEPARATO, senza `needs`, che gira
  # in parallelo con `update` e quindi NON blocca ne' ritarda il commit dei
  # dati. Fallisce con ::error:: (eta' in ore nel messaggio) se
  # SoccerMath/database/live_odds.json manca o se generato_il ha piu' di 26
  # ore. GitHub invia la notifica di "workflow fallito" anche quando il job
  # `update' e' andato a buon fine: e' la rete di sicurezza per quando
  # entrambi i cron delle quote (08:17 e 10:47) non partono.
  # Nessuna chiamata di rete, nessuna chiave, 0 crediti: legge solo il file.
  allarme-quote-vecchie:
    name: Allarme quote vecchie (non blocca il commit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verifica freschezza di live_odds.json (soglia 26 ore)
        working-directory: SoccerMath
        run: python update_live_odds.py --allarme-vecchie
