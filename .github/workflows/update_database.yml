name: Aggiorna Database

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Stesso gruppo di update_xg.yml: entrambi committano dati sullo stesso branch.
concurrency:
  group: soccermath-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SoccerMath
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check API key
        run: |
          if [ -z "${{ secrets.FOOTBALL_DATA_API_KEY }}" ]; then
            echo "::error::FOOTBALL_DATA_API_KEY mancante. Aggiungila in Settings → Secrets."
            exit 1
          fi
          echo "API key presente."
          
      - name: Archivia stagione precedente (rollover)
        run: python season_rollover.py
      
      - name: Update live database
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python update_db.py
      
      # Lo scraping xG NON avviene piu' qui: l'unica acquisizione Understat e'
      # .github/workflows/update_xg.yml (update_all_xg_db.py + update_xg.py).
      # Lasciarlo qui significava un secondo download, con uno snapshot diverso
      # da quello dell'archivio e medie incoerenti fra loro.

      - name: Commit e push (con retry se main si muove)
        working-directory: ${{ github.workspace }}
        run: |
          set -uo pipefail
          BRANCH="${{ github.ref_name }}"
          git config --global user.name "M4 Bot"
          git config --global user.email "action@github.com"
          git add -A -- 'SoccerMath/database/*.csv'
          if git diff --cached --quiet; then
            echo "Nessun cambiamento: niente da committare."
            exit 0
          fi
          git commit -m "Auto-update live data $(date -u +%Y-%m-%dT%H:%M)Z"
          for i in 1 2 3 4; do
            if git push -q origin "HEAD:$BRANCH"; then
              echo "Push ok."
              exit 0
            fi
            echo "Push rifiutato (main avanti): rebase e riprovo ($i/4)"
            git fetch -q origin "$BRANCH"
            if ! git rebase -q "origin/$BRANCH"; then
              git rebase --abort
              echo "::error::Conflitto sui CSV, serve intervento manuale"
              exit 1
            fi
            sleep $((i * 8))
          done
          echo "::error::Push non riuscito dopo 4 tentativi"
          exit 1
