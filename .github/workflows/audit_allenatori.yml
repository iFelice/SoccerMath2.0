name: Sonda allenatori (football-data.org, manuale)

# Sonda di SOLA LETTURA degli allenatori delle 5 leghe, dalle API
# football-data.org v4 (GET /competitions/{code}/teams e GET /teams/{id}).
# Salva una voce per squadra (id, nome, allenatore, contract.start,
# contract.until, istante della chiamata) in audit/data/allenatori/<giorno>.json
# e riscrive il referto audit/results/sonda_allenatori.md, che mette la REGOLA
# prima dei numeri: l'allenatore entra nella scheda partita solo se la copertura
# e' >= 95% e tutti i casi di esonero 2026/27 verificati su fonti pubbliche
# risultano aggiornati nelle API.
#
# QUANDO SI SCRIVE IL FILE CON LA DATA. Solo da un run di RETE con almeno una
# chiamata riuscita:
#   * la sonda, senza chiave, esce con 3 e non scrive niente;
#   * la sonda, se tutte le leghe falliscono, esce con 2 e non scrive niente
#     (ne' snapshot, ne' referto);
#   * i run di prova `--fixture` scrivono in audit/output/ (cartella non
#     versionata) con il prefisso `fixture_`: non possono produrre un
#     audit/data/allenatori/<giorno>.json;
#   * lo step «Lo snapshot con la data viene solo da un run di rete riuscito»
#     ricontrolla il file appena scritto (modalita', chiamate, squadre con
#     allenatore) e, se non torna, FALLISCE PRIMA del commit: nessun file con la
#     data e nessun referto vengono committati da un run andato storto.
#
# Trigger: SOLO workflow_dispatch (nessun cron, nessun push, nessuna PR): il run
# lo lancia Felice a mano. La sonda non tocca l'applicazione.
#
# Chiave: secret FOOTBALL_DATA_API_KEY, passata come variabile d'ambiente e MAI
# stampata (le API v4 vogliono l'intestazione X-Auth-Token, quindi la chiave non
# finisce nemmeno negli URL). Nessun `set -x`. La sonda rifiuta di scrivere un
# file che contenga la chiave e uno step finale lo verifica sui file salvati.
#
# Limite di chiamate: 10 al minuto (piano gratuito di football-data.org), con
# finestra mobile dentro lo script: ~5 chiamate per le 5 leghe + 1 per squadra
# (~100 squadre) = ~11 minuti in tutto.

on:
  workflow_dispatch:
    inputs:
      stagione:
        description: "Stagione di partenza (es. 2026). Vuoto = quella predefinita delle API"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: audit-allenatori
  cancel-in-progress: false

jobs:
  sonda:
    name: Sonda allenatori (5 leghe)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # requests per la sonda, pytest per lo step successivo: il run 38393792900
      # (2026-10-13, primo lancio manuale) si e' fermato qui con
      # "No module named pytest" perche' lo step installava solo requests.
      # `pytest` e' scritto come in test_suite.yml (senza pin): la stessa
      # specifica risolve la stessa versione nei due workflow. La versione
      # risolta viene stampata e messa in un'annotazione, leggibile dall'API
      # anche da chi non puo' aprire i log del run.
      - name: "Dipendenze (requests per la sonda, pytest per il test offline)"
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest
          PYTEST_VER=$(python -m pytest --version 2>&1 | head -n 1)
          VERSIONI=$(python - <<'PY'
          import platform
          from importlib.metadata import version
          print(f"python {platform.python_version()}, "
                f"requests {version('requests')}, pytest {version('pytest')}")
          PY
          )
          echo "$VERSIONI"
          echo "$PYTEST_VER"
          # Annotazione: si legge dall'API (check-runs/<job>/annotations) anche
          # senza poter aprire i log del run.
          echo "::notice::ambiente sonda allenatori -> $VERSIONI | runner ${ImageOS:-n/d} ${ImageVersion:-n/d}"

      - name: Test offline della sonda (nessuna rete, nessuna chiave)
        run: python -m pytest audit/test_sonda_allenatori.py -q

      # Esistenza del secret SENZA leggerne il valore (come totals_probe.yml).
      - name: Verifica FOOTBALL_DATA_API_KEY (senza stamparla)
        env:
          CHIAVE: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          if [ -z "$CHIAVE" ]; then
            echo "::error::FOOTBALL_DATA_API_KEY mancante. Aggiungila in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "FOOTBALL_DATA_API_KEY presente (valore non letto, non stampato)."

      - name: Scarica allenatori e scrivi referto (10 chiamate al minuto)
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          STAGIONE: ${{ github.event.inputs.stagione }}
        run: |
          # lo script accetta --stagione "" (vuoto = stagione predefinita delle
          # API): nessuna espansione condizionale, nessuna parola spezzata
          set +e
          python audit/sonda_allenatori.py \
            --stagione "$STAGIONE" \
            --keep-going 2>&1 | tee /tmp/sonda_allenatori.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit=$rc"
          # 3 = chiave assente (non dovrebbe accadere: lo step sopra l'ha gia' verificata)
          if [ "$rc" = "3" ]; then
            echo "::error::chiave assente nell'ambiente"
            exit 1
          fi
          # 2 = nessuna chiamata riuscita: la sonda non ha scritto nulla e la
          # regola resta non verificata. Non si committa niente.
          if [ "$rc" = "2" ]; then
            echo "::error::nessuna chiamata riuscita: nessuno snapshot, nessun referto, nessun commit"
            exit 1
          fi
          if [ "$rc" != "0" ]; then
            echo "::warning::sonda con errori su almeno una lega: il referto li elenca"
          fi

      # Il file con la data e' la prova che le API hanno risposto. Qui si
      # ricontrolla PRIMA del commit: modalita' rete, almeno una chiamata
      # riuscita, nessun file di prova (`fixture_`) nella cartella versionata.
      - name: Lo snapshot con la data viene solo da un run di rete riuscito
        run: |
          python - <<'PY'
          import glob, json, os, sys
          from datetime import datetime, timedelta, timezone

          adesso = datetime.now(timezone.utc)
          limite = adesso - timedelta(hours=8)   # questo run (dura ~11 minuti)
          problemi = []
          trovati = 0

          for percorso in sorted(glob.glob("audit/data/allenatori/*.json")):
              nome = os.path.basename(percorso)
              if nome.startswith("fixture_"):
                  problemi.append(f"{nome}: un file di prova nella cartella degli snapshot")
                  continue
              if nome.startswith("casi_"):
                  continue
              with open(percorso, encoding="utf-8") as fh:
                  dati = json.load(fh)
              scritto = str(dati.get("scritto_il") or "")
              try:
                  quando = datetime.strptime(scritto, "%Y-%m-%dT%H:%M:%SZ").replace(
                      tzinfo=timezone.utc)
              except ValueError:
                  continue
              if quando < limite:
                  continue
              trovati += 1
              modalita = dati.get("modalita")
              chiamate = int(dati.get("chiamate") or 0)
              coperti = int(dati.get("con_allenatore") or 0)
              squadre = int(dati.get("squadre") or 0)
              print(f"{nome}: scritto_il={scritto} modalita={modalita} "
                    f"squadre={squadre} con_allenatore={coperti} chiamate={chiamate}")
              if modalita != "rete":
                  problemi.append(f"{nome}: modalita' {modalita!r}, non «rete»")
              if chiamate < 1 or coperti < 1 or squadre < 1:
                  problemi.append(f"{nome}: nessuna chiamata riuscita "
                                  f"(chiamate={chiamate}, con_allenatore={coperti})")

          if trovati == 0:
              problemi.append("questo run non ha scritto nessuno snapshot: "
                              "niente da committare")
          if problemi:
              for problema in problemi:
                  print(f"::error::{problema}")
              sys.exit(1)
          print("OK: lo snapshot con la data viene da un run di rete con chiamate riuscite.")
          PY

      # La chiave si cerca per VALORE (da variabile d'ambiente: mai stampata) e
      # si controlla che nei file non finisca un'intestazione con un token. Il
      # nome dell'intestazione puo' comparire nel referto (e' documentazione),
      # il suo valore no.
      - name: Nessuna chiave nei file salvati
        env:
          CHIAVE: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          if [ -n "$CHIAVE" ] && grep -rFq "$CHIAVE" audit/data/allenatori audit/results/sonda_allenatori.md; then
            echo "::error::la chiave API e' finita nei file salvati"
            exit 1
          fi
          if grep -rEq 'X-Auth-Token:[[:space:]]*[A-Za-z0-9]' audit/data/allenatori audit/results/sonda_allenatori.md; then
            echo "::error::un'intestazione di autenticazione con un token e' finita nei file salvati"
            exit 1
          fi
          echo "OK: nessuna chiave nei file."

      - name: Riepilogo nel job
        run: |
          head -n 40 audit/results/sonda_allenatori.md >> "$GITHUB_STEP_SUMMARY"

      - name: Referto e snapshot come artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonda-allenatori-${{ github.run_id }}
          path: |
            audit/data/allenatori/
            audit/results/sonda_allenatori.md
          if-no-files-found: warn
          retention-days: 30

      # Commit con retry: stesso schema degli altri workflow manuali (rebase prima del push).
      - name: Commit dello snapshot e del referto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/data/allenatori audit/results/sonda_allenatori.md
          # Nessun file di prova nella storia: se un `fixture_` fosse finito
          # nella cartella versionata, il run si ferma qui.
          if git diff --cached --name-only | grep -q "fixture_"; then
            echo "::error::un file di prova (fixture_) e' finito fra i file da committare"
            git diff --cached --name-only
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "nessuna modifica da committare"
            exit 0
          fi
          git commit -m "audit: sonda allenatori football-data.org (manuale)"
          for i in 1 2 3; do
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "push ok"
              exit 0
            fi
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done
          echo "::error::push fallito dopo 3 tentativi"
          exit 1
