name: Temp squalifiche feasibility from PPDA artifact

on:
  push:
    branches:
      - 'arena/7ff66814-soccermath2-0'
    paths:
      - '.github/workflows/squalifiche_feasibility_tmp.yml'
      - 'audit/squalifiche_feasibility.py'

permissions:
  contents: write
  actions: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: arena/7ff66814-soccermath2-0
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r SoccerMath/requirements.txt pyarrow pytest

      - name: Download fresh PPDA/player artifact from run 37461010400
        uses: actions/download-artifact@v4
        with:
          name: ppda-player-verify-37461010400
          run-id: 37461010400
          github-token: ${{ github.token }}
          path: audit/output/ppda-player-verify-37461010400

      - name: Generate squalifiche feasibility report
        run: |
          python audit/squalifiche_feasibility.py \
            --player-match-dir audit/output/ppda-player-verify-37461010400/database \
            --report audit/results/squalifiche_feasibility.md \
            --json audit/output/squalifiche_feasibility_sources.json \
            --artifact-run-id 37461010400 \
            --artifact-id 11415875090 \
            --artifact-name ppda-player-verify-37461010400 \
            --artifact-size 10030865 \
            --artifact-created 2026-10-06T12:51:23Z \
            --artifact-expires 2026-10-20T12:51:20Z \
            --artifact-expired false
          git checkout -- audit/results/elo_weight_retune.md || true
          git status --short

      - name: Commit generated report
        run: |
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git add audit/squalifiche_feasibility.py audit/results/squalifiche_feasibility.md
          if git diff --cached --quiet; then
            echo "No tracked changes to commit"
          else
            git commit -m "audit: regenerate squalifiche feasibility with player artifact"
            git push origin HEAD:arena/7ff66814-soccermath2-0
          fi
