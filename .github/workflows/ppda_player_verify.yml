name: Verifica PPDA/deep/giocatore (sola lettura)

# MODALITA' VERIFICA dei due archivi NUOVI (PPDA/deep completions per squadra
# per partita, statistiche giocatore per partita): acquisizione REALE delle 5
# leghe da Understat, validazione, confronto con i dati committati, audit di
# copertura e generazione del rapporto di fattibilita'.
#
# Che cosa NON fa, per costruzione:
#   * nessun commit e nessun push (permissions: contents: read);
#   * non scrive dentro SoccerMath/database ne' in audit/results: l'output va in
#     una cartella di lavoro non versionata (ppda-player-out/) e uno step finale
#     verifica che i file committati siano rimasti identici;
#   * non tocca app.py, config.py o models/: i due archivi non sono letti dal
#     motore Poisson/Elo (nessun collegamento in questa fase);
#   * nessun segreto (nessun JSONBin, nessuna API key).
#
# Il rapporto (`ppda_deep_player_feasibility.md`) viene generato dallo script di
# audit sui dati appena scaricati e pubblicato come artifact: il markdown
# prodotto e' il referto da committare in audit/results/.
#
# Costo dichiarato: `read_player_match_stats()` e' 1 richiesta HTTP per partita
# (~7.000 partite sull'intero perimetro), mentre PPDA/deep sono 1 payload di
# lega per lega: per questo il job ha un timeout ampio e il parallelismo e'
# regolabile (soccerdata non applica nessun rate limit a Understat). Misurato
# sulla prima esecuzione reale (2026-09-15, 5 leghe, 2 leghe in parallelo):
# circa 30 minuti, 8 file prodotti.
#
# Tolleranza dichiarata in modalita' verifica: `--missing-tolerance-ratio 0.01`
# (1% delle partite del perimetro). Non e' un ripiego silenzioso: il referto
# riporta quante partite mancano, per stagione, con l'eta' e il motivo (partita
# illeggibile, payload assente). Lo script, di suo, ha tolleranza 0.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Stagioni soccerdata per PPDA/deep (formato 2627), separate da spazio. Vuoto = finestra mobile derivata dalla data (stagione corrente + 4 precedenti)"
        required: false
        default: ""
      player_seasons:
        description: "Stagioni per le statistiche giocatore (vuoto = come sopra)"
        required: false
        default: ""
      sample_matches_per_league:
        description: "Solo le N partite piu' recenti per lega (vuoto = perimetro intero)"
        required: false
        default: ""
      parallel_leagues:
        description: "Leghe acquisite in parallelo"
        required: false
        default: "2"
      missing_tolerance_ratio:
        description: "Frazione ammessa di partite NON di frontiera senza dati: la modalita' verifica DICHIARA questo valore nel referto (lo script ha default 0)"
        required: false
        default: "0.01"
  # Un workflow presente solo su un branch non di default NON e' avviabile da
  # workflow_dispatch: il push su arena/** garantisce comunque una esecuzione
  # reale su questo branch.
  push:
    branches:
      - 'arena/**'
    paths:
      - '.github/workflows/ppda_player_verify.yml'
      - 'update_all_ppda_player_db.py'
      - 'SoccerMath/match_stats_archive.py'
      - 'SoccerMath/test_match_stats_pipeline.py'
      - 'SoccerMath/xg_archive.py'
      - 'SoccerMath/team_names.py'
      - 'SoccerMath/team_aliases.py'
      - 'audit/ppda_deep_player_audit.py'

permissions:
  contents: read

concurrency:
  group: ppda-player-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifica:
    # ubuntu-24.04 e NON ubuntu-latest: l'acquisizione deve girare sullo stesso
    # OS del run riuscito di riferimento (37917985080, 2026-10-09, 44m22s,
    # Ubuntu 24.04). Non e' la causa del segfault del 2026-10-13 (fra l'immagine
    # 20261004.327.1 usata il 9/10 e la 20261012.334.1 pubblicata il 13/10 alle
    # 10:25 UTC cambiano solo Kotlin, Homebrew, Gradle, Bazel, il Go in cache e
    # una patch di sudo: OS 24.04.5 LTS, kernel 6.17.0-1022-azure e systemd
    # identici), ma `ubuntu-latest` passa a Ubuntu 26.04: l'annotazione presente
    # in entrambi i run dice "will migrate to Ubuntu 26 beginning October 19,
    # 2026" (actions/runner-images#14748) e le note dell'immagine 20261012
    # dicono "in November 2026". Fissare l'etichetta evita che un archivio che
    # deve essere riproducibile cambi sistema operativo di nascosto.
    runs-on: ubuntu-24.04
    # 1 richiesta per partita sulle statistiche giocatore: il job e' lungo per
    # costruzione (misurato e riportato nel referto).
    timeout-minutes: 240

    env:
      # NB: VERIFY_DIR non puo' stare qui: il contesto `runner` non e' un valore
      # riconosciuto in `jobs.<job_id>.env` (il workflow risulterebbe invalido).
      # Viene impostata nel primo step, dentro $GITHUB_ENV, da $RUNNER_TEMP.
      # vuoto (default e push) = finestra mobile derivata dalla data dallo script
      SEASONS: ${{ github.event.inputs.seasons || '' }}
      PLAYER_SEASONS: ${{ github.event.inputs.player_seasons || '' }}
      SAMPLE_MATCHES: ${{ github.event.inputs.sample_matches_per_league || '' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout del branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Versione dichiarata e verificata: le colonne di read_team_match_stats()
      # e read_player_match_stats() sono state controllate su questa release.
      - name: Installazione dipendenze (soccerdata pinnato)
        run: |
          python -m pip install --upgrade pip
          # `wrapper-tls-requests` e' la dipendenza di soccerdata che scarica a
          # runtime la libreria C condivisa di tls-client e la apre con ctypes.
          # soccerdata 1.9.1 la chiede solo come `<3.0.0,>=1.1.4`, quindi fino a
          # qui pip metteva l'ultima disponibile: qui si PINNA alla 1.2.5, che e'
          # l'ultima pubblicata (2026-02-23) ed e' percio' quella che girava sia
          # nel run riuscito 37917985080 (2026-10-09) sia in quello fallito
          # 38393468899 (2026-10-13). Dentro la 1.2.5 la versione della libreria
          # tls-client e' fissata a v1.13.1 (LATEST_VERSION_TAG_NAME in
          # tls_requests/models/libraries.py): lo step successivo lo verifica e
          # si ferma se un aggiornamento del wrapper la cambia.
          pip install 'soccerdata==1.9.1' 'wrapper-tls-requests==1.2.5' pandas pytest
          python - <<'PY'
          import platform
          from importlib.metadata import version
          print("soccerdata installato:", version("soccerdata"))
          print("wrapper-tls-requests installato:", version("wrapper-tls-requests"))
          print("python:", platform.python_version())
          PY
          echo "::notice::ambiente verifica PPDA -> python $(python -c 'import platform;print(platform.python_version())'), soccerdata $(python -c 'from importlib.metadata import version;print(version("soccerdata"))'), wrapper-tls-requests $(python -c 'from importlib.metadata import version;print(version("wrapper-tls-requests"))'), pandas $(python -c 'import pandas;print(pandas.__version__)') | runner ${ImageOS:-n/d} ${ImageVersion:-n/d} (${RUNNER_OS:-n/d})"

      # ---------------------------------------------------------------------
      # La libreria C condivisa di tls-client NON deve piu' scaricarsi durante
      # l'acquisizione.
      #
      # IL GUASTO. `tls_requests.models.tls.TLSClient.initialize()` chiama
      # `TLSLibrary.load()` alla PRIMA richiesta e non ha nessun lock: se la
      # libreria manca, `load()` la scarica in site-packages/tls_requests/bin/
      # con `open(destinazione, "wb")` (che TRONCA il file) e poi la apre con
      # `ctypes.cdll.LoadLibrary`; in piu' `cleanup_files()` cancella le altre
      # librerie della cartella. Con `--parallel-leagues 2` quella prima
      # richiesta succede dentro due worker thread del ThreadPoolExecutor dello
      # script (ogni lega crea la sua istanza di `sd.Understat`, quindi il suo
      # `tls_requests.Client`): i due thread scrivono/aprono lo STESSO file e
      # uno dei due apre con ctypes un ELF scritto a meta' -> SIGSEGV. E' il run
      # 38393468899 (2026-10-13, step «Acquisizione reale», 5 secondi:
      # "Downloading tls-client-linux-ubuntu-amd64-1.13.1.so: [...] 100.0%"
      # seguito da "Segmentation fault (core dumped)", exit 139).
      #
      # PERCHE' E' UNA CORSA E NON UN AMBIENTE ROTTO. Il run riuscito
      # 37917985080 (2026-10-09) ha lo stesso identico script e lo stesso
      # workflow (nessun commit fra bcbeb74 e f7029be tocca
      # update_all_ppda_player_db.py, ppda_player_verify.yml,
      # SoccerMath/match_stats_archive.py, xg_archive.py o
      # audit/ppda_deep_player_audit.py: l'ultima modifica e' del 2026-09-19),
      # lo stesso soccerdata pinnato, lo stesso wrapper-tls-requests (1.2.5,
      # ultima release dal 2026-02-23) e quindi la stessa libreria tls-client
      # v1.13.1, il cui asset `tls-client-linux-ubuntu-amd64-1.13.1.so` ha
      # digest sha256 e4a4a5d7...78fc e data 2026-01-10, mai cambiati. Il 9/10
      # la corsa fra i due thread e' andata bene, il 13/10 no.
      #
      # LA CORREZIONE. Download UNA volta sola, nel thread principale, PRIMA di
      # qualunque lavoro parallelo; sha256 confrontato con quello pubblicato da
      # GitHub per l'asset; prova di carico con dlopen + una richiesta TLS reale;
      # `TLS_LIBRARY_PATH` dice a tls_requests di usare quel file e di NON
      # scaricare piu' niente a runtime (la libreria resta anche in
      # tls_requests/bin/, cosi' pure senza la variabile la versione locale
      # risulta gia' pari a quella richiesta e il download non parte). Con il
      # file completo e immutabile, il `LoadLibrary` concorrente dei worker e'
      # innocuo: dlopen di glibc e' esso stesso protetto da lock.
      # ---------------------------------------------------------------------
      - name: "Libreria tls-client: scaricata una volta, hash verificato, precaricata"
        id: tlslib
        env:
          # Tutto PINNATO: versione della release, nome dell'asset, URL e sha256
          # pubblicato da GitHub per quell'asset (creato il 2026-01-10T16:34:30Z,
          # 15236872 byte; gh api repos/bogdanfinn/tls-client/releases/tags/v1.13.1).
          # E' la libreria che wrapper-tls-requests 1.2.5 chiede
          # (LATEST_VERSION_TAG_NAME = v1.13.1) ed e' quella che il run riuscito
          # 37917985080 (2026-10-09) ha usato: il digest non e' mai cambiato.
          TLS_CLIENT_VERSION: v1.13.1
          TLS_CLIENT_ASSET: tls-client-linux-ubuntu-amd64-1.13.1.so
          TLS_CLIENT_URL: https://github.com/bogdanfinn/tls-client/releases/download/v1.13.1/tls-client-linux-ubuntu-amd64-1.13.1.so
          TLS_CLIENT_SHA256: e4a4a5d771d1bd1558186a5ee46af1dfa1318bd31950d68ccd81ed30bad078fc
        run: |
          set -euo pipefail

          # 0. Il wrapper deve chiedere QUESTA versione, e il runner deve essere
          #    quello per cui l'asset e' costruito (linux amd64 Ubuntu): nessun
          #    binario giusto "piu' o meno".
          BIN_DIR=$(python - <<'PY'
          import os
          import sys

          from importlib.metadata import version as pkg_version
          from tls_requests.models.libraries import (BIN_DIR, FILE_EXT, IS_UBUNTU,
                                                     LATEST_VERSION_TAG_NAME, MACHINE,
                                                     PLATFORM)

          attesa = os.environ["TLS_CLIENT_VERSION"]
          wrapper = pkg_version("wrapper-tls-requests")
          print(f"wrapper-tls-requests {wrapper}: libreria tls-client richiesta "
                f"{LATEST_VERSION_TAG_NAME}", file=sys.stderr)
          if LATEST_VERSION_TAG_NAME != attesa:
              print(f"::error::wrapper-tls-requests {wrapper} chiede tls-client "
                    f"{LATEST_VERSION_TAG_NAME}, questo workflow e' tarato su {attesa}: "
                    f"aggiornare TLS_CLIENT_VERSION, TLS_CLIENT_ASSET, TLS_CLIENT_URL e "
                    f"TLS_CLIENT_SHA256. Nessun cambio silenzioso della libreria TLS.",
                    file=sys.stderr)
              sys.exit(1)
          print(f"piattaforma rilevata dal wrapper: {PLATFORM} {MACHINE} "
                f"ubuntu={IS_UBUNTU} estensione={FILE_EXT}", file=sys.stderr)
          if PLATFORM != "linux" or MACHINE != "amd64" or FILE_EXT != "so" or not IS_UBUNTU:
              print(f"::error::l'asset pinnato e' {os.environ['TLS_CLIENT_ASSET']} "
                    f"(linux ubuntu amd64), ma il runner e' {PLATFORM} {MACHINE} "
                    f"ubuntu={IS_UBUNTU}: il pin va rifatto per questa piattaforma.",
                    file=sys.stderr)
              sys.exit(1)
          print(BIN_DIR)
          PY
          )
          echo "cartella delle librerie di tls_requests: $BIN_DIR"

          # 1. Download SERIALE, nel thread principale, PRIMA del lavoro
          #    parallelo: una sola scrittura del file, nessuna corsa fra thread.
          #    curl sull'URL canonico dell'asset: nessuna chiamata all'API dei
          #    rilasci (che senza token ha il limite di 60/ora per IP).
          mkdir -p "$BIN_DIR" "$RUNNER_TEMP/tls-client-bin"
          DEST="$RUNNER_TEMP/tls-client-bin/$TLS_CLIENT_ASSET"
          echo "scarico $TLS_CLIENT_URL"
          curl --fail --location --retry 3 --retry-delay 2 --show-error \
               --max-time 300 --output "$DEST" "$TLS_CLIENT_URL"

          # 2. Il binario e' QUELLO pubblicato: niente ELF tronco, niente asset
          #    sostituito, niente sorpresa se un giorno cambia.
          if ! printf '%s  %s\n' "$TLS_CLIENT_SHA256" "$DEST" | sha256sum --strict -c -; then
            echo "::error::sha256 della libreria tls-client scaricata diverso da $TLS_CLIENT_SHA256 ($TLS_CLIENT_ASSET): il binario pubblicato e' cambiato, nessuna acquisizione con una libreria non verificata"
            sha256sum "$DEST" || true
            exit 1
          fi
          echo "sha256 verificato: $(stat -c '%s byte' "$DEST")"

          # 3. La libreria verificata va ANCHE nella cartella che tls_requests
          #    guarda di suo: se TLS_LIBRARY_PATH per qualunque motivo non
          #    arrivasse al processo, `TLSLibrary.load()` troverebbe un file
          #    completo e della versione richiesta, quindi non scaricherebbe
          #    nulla (e la corsa fra thread non potrebbe nemmeno iniziare).
          cp -f "$DEST" "$BIN_DIR/$TLS_CLIENT_ASSET"
          echo "TLS_LIBRARY_PATH=$DEST" >> "$GITHUB_ENV"
          echo "$DEST" > "$RUNNER_TEMP/tls-library-path.txt"
          echo "TLS_LIBRARY_PATH=$DEST (tls_requests non scarica piu' niente a runtime)"

          # 4. Prova di carico in un processo nuovo, con TLS_LIBRARY_PATH gia'
          #    impostato (le stesse condizioni dell'acquisizione): dlopen,
          #    simboli, TLSLibrary.load() e UNA richiesta TLS reale all'host che
          #    l'acquisizione usa. Se la libreria non si carica il run si ferma
          #    QUI, con un messaggio leggibile, invece che con un segnale fatale
          #    dentro l'acquisizione parallela.
          PERCORSO=$(cat "$RUNNER_TEMP/tls-library-path.txt")
          TLS_LIBRARY_PATH="$PERCORSO" python - <<'PY'
          import ctypes
          import os
          import sys
          import time

          percorso = os.environ["TLS_LIBRARY_PATH"]
          lib = ctypes.CDLL(percorso)          # dlopen: qui il run 38393468899 e' morto
          print("dlopen ok:", percorso)
          for simbolo in ("request", "destroySession", "destroyAll", "freeMemory"):
              if not hasattr(lib, simbolo):
                  print(f"::error::la libreria tls-client non esporta {simbolo}: binario sbagliato")
                  sys.exit(1)
          print("simboli esportati: request, destroySession, destroyAll, freeMemory")

          from tls_requests.models.libraries import TLSLibrary
          print("TLSLibrary.load() ->", TLSLibrary.load())
          import tls_requests
          for tentativo in (1, 2, 3):
              try:
                  risposta = tls_requests.get("https://understat.com/", timeout=30)
                  print(f"handshake TLS reale ok: HTTP {risposta.status_code} "
                        f"({len(risposta.content)} byte, tentativo {tentativo})")
                  break
              except Exception as ecc:
                  print(f"tentativo {tentativo}: {type(ecc).__name__}: {ecc}")
                  if tentativo == 3:
                      # La libreria si carica e i simboli ci sono: qui il problema
                      # sarebbe la rete, non il binario. Non si blocca il run.
                      print("::warning::libreria tls-client caricata e verificata, ma la "
                            f"richiesta di prova a understat.com non e' riuscita: "
                            f"{type(ecc).__name__}: {ecc}")
                  else:
                      time.sleep(3)
          print("libreria tls-client pronta: l'acquisizione non scarica nulla a runtime")
          PY

          echo "::notice::tls-client $TLS_CLIENT_VERSION: $TLS_CLIENT_ASSET $(stat -c '%s' "$DEST") byte sha256=$TLS_CLIENT_SHA256 (verificato), wrapper-tls-requests $(python -c 'from importlib.metadata import version;print(version("wrapper-tls-requests"))'), precaricata via TLS_LIBRARY_PATH; runner ${ImageOS:-n/d} ${ImageVersion:-n/d}"

      # Cartella di lavoro FUORI dal repository ($RUNNER_TEMP): la verifica non
      # scrive mai dentro SoccerMath/database ne' in audit/results, e non lascia
      # nemmeno file non versionati nel checkout.
      - name: Cartella di lavoro del run (fuori dal repository)
        run: |
          echo "VERIFY_DIR=$RUNNER_TEMP/ppda-player-out" >> "$GITHUB_ENV"
          echo "Cartella di lavoro: $RUNNER_TEMP/ppda-player-out"

      - name: Prepara le cartelle temporanee
        run: mkdir -p "$VERIFY_DIR/database" "$VERIFY_DIR/reports" "$VERIFY_DIR/cache"

      - name: Test offline della pipeline (nessuna rete)
        run: |
          python -m pytest SoccerMath/test_match_stats_pipeline.py \
                           SoccerMath/test_xg_pipeline.py -q --tb=short

      # 1. Acquisizione REALE. L'output va nella cartella temporanea, ma il
      #    confronto partita-per-partita usa i dati committati (--baseline-dir):
      #    se non esiste ancora una baseline, il report lo dichiara ("primo
      #    snapshot") e il confronto si attiva dal secondo snapshot in poi.
      #    Exit code != 0 se una lega fallisce: nessun file parziale.
      - name: Acquisizione reale (Understat, 5 leghe)
        id: acquisizione
        run: |
          python update_all_ppda_player_db.py \
            ${SEASONS:+--seasons $SEASONS} \
            ${PLAYER_SEASONS:+--player-seasons $PLAYER_SEASONS} \
            ${SAMPLE_MATCHES:+--sample-matches-per-league $SAMPLE_MATCHES} \
            --parallel-leagues ${{ github.event.inputs.parallel_leagues || '2' }} \
            --retries 2 \
            --frontier-days 1 \
            --missing-tolerance-ratio ${{ github.event.inputs.missing_tolerance_ratio || '0.01' }} \
            --max-duplicate-rows-ratio 0.02 \
            --max-structural-na-ratio 0.01 \
            --output-dir "$VERIFY_DIR/database" \
            --baseline-dir SoccerMath/database \
            --cache-dir "$VERIFY_DIR/cache" \
            --report "$VERIFY_DIR/reports/acquisizione.json"

      # 2. Audit e rapporto di fattibilita': gira SEMPRE (anche se
      #    l'acquisizione fallisce) cosi' il referto dichiara il motivo del
      #    fallimento invece di sparire. Nessun collegamento al motore.
      - name: Audit di copertura e qualita' dato
        if: always()
        run: |
          set +e
          python audit/ppda_deep_player_audit.py \
            --database-dir "$VERIFY_DIR/database" \
            --xg-dir SoccerMath/database \
            --acquisition-report "$VERIFY_DIR/reports/acquisizione.json" \
            --results-dir "$VERIFY_DIR/reports" \
            --run-url "$RUN_URL" \
            --run-id "${{ github.run_id }}"
          code=$?
          set -e
          # Evidenza anche nei LOG, non solo nell'artifact: il referto generato e
          # i report vengono stampati in chiaro (markdown), in forma compatta
          # (JSON) e in base64 con sha256, cosi' il contenuto prodotto dal run e'
          # verificabile anche da chi non puo' scaricare l'artifact.
          REPORT_MD="$VERIFY_DIR/reports/ppda_deep_player_feasibility.md"
          REPORT_JSON="$VERIFY_DIR/reports/ppda_deep_player_feasibility.json"
          echo "=== EVIDENZA: report di acquisizione (JSON compatto) ==="
          for path in "$VERIFY_DIR/reports/acquisizione.json" "$REPORT_JSON"; do
            if [ -f "$path" ]; then
              echo "=== JSON COMPATTO ($path) ==="
              python -c "import json,sys; print(json.dumps(json.load(open(sys.argv[1], encoding='utf-8')), ensure_ascii=False, separators=(',', ':')))" "$path"
            fi
          done
          if [ -f "$REPORT_MD" ]; then
            echo "=== REFERTO: sha256 dei file prodotti ==="
            sha256sum "$REPORT_MD" "$REPORT_JSON" 2>/dev/null || true
            echo "=== REFERTO: base64 (righe da 76 caratteri) ==="
            base64 -w 76 "$REPORT_MD"
            # Copia compressa: il referto (markdown) e la sua versione
            # machine-readable (JSON) compressi stanno in poche righe di log,
            # quindi restano ricostruibili byte per byte anche senza artifact
            # (l'hash qui sopra e' la prova). `gzip -n` non mette data/ora
            # nell'intestazione: l'output dipende solo dal contenuto.
            echo "=== REFERTO: gzip+base64 dei file prodotti ==="
            for path in "$REPORT_MD" "$REPORT_JSON"; do
              if [ -f "$path" ]; then
                echo "=== FILE: $path (gzip+base64, righe da 76 caratteri) ==="
                gzip -9nc "$path" | base64 -w 76
              fi
            done
          fi
          exit $code

      - name: Riepilogo nel summary del run
        if: always()
        run: |
          {
            echo "## Verifica PPDA/deep/giocatore (sola lettura)"
            echo
            echo "Run: $RUN_URL"
            echo
            echo "### Acquisizione (estratto)"
            echo '```json'
            python - <<'PY'
          import json, os
          path = os.path.join(os.environ["VERIFY_DIR"], "reports", "acquisizione.json")
          if not os.path.exists(path):
              print("(report di acquisizione assente)")
          else:
              data = json.load(open(path, encoding="utf-8"))
              for outcome in data.get("leagues", []):
                  for dataset, payload in (outcome.get("datasets") or {}).items():
                      errors = payload.get("errors") or []
                      print(f"{outcome['league']} / {dataset}: "
                            f"scritto={payload.get('written')} "
                            f"partite={payload.get('matches')} "
                            f"righe={payload.get('rows')} "
                            f"secondi={payload.get('seconds')} "
                            f"baseline={payload.get('baseline_found')} "
                            f"errori={len(errors)}")
                      for err in errors[:3]:
                          print(f"    - {err}")
          PY
            echo '```'
            echo "### Copertura (dal referto)"
            head -n 40 "$VERIFY_DIR/reports/ppda_deep_player_feasibility.md" 2>/dev/null || echo "(referto assente)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Prove del run leggibili anche dall'API (check-runs/<job>/annotations):
      # log e artifact stanno su host che non tutti riescono ad aprire
      # (results-receiver.actions.githubusercontent.com,
      # productionresultssa*.blob.core.windows.net), le annotazioni si leggono
      # con `gh api repos/<repo>/check-runs/<job_id>/annotations`. E' un
      # riassunto compatto, non un sostituto dei log: i numeri completi restano
      # nel referto e nell'artifact.
      - name: Esito dell'acquisizione nelle annotazioni (leggibili dall'API)
        if: always()
        run: |
          python - <<'PY'
          import json
          import os

          verify = os.environ.get("VERIFY_DIR", "")
          reports = os.path.join(verify, "reports")
          percorso = os.path.join(reports, "acquisizione.json")
          sample = os.environ.get("SAMPLE_MATCHES", "") or "perimetro intero"

          if not os.path.exists(percorso):
              print(f"::notice::acquisizione -> report assente ({percorso}): "
                    f"il processo e' morto prima di scriverlo (sample={sample})")
          else:
              with open(percorso, encoding="utf-8") as fh:
                  dati = json.load(fh)
              parti = []
              tot_partite = tot_righe = tot_errori = 0
              for esito in dati.get("leagues", []):
                  for nome, payload in (esito.get("datasets") or {}).items():
                      errori = payload.get("errors") or []
                      partite = int(payload.get("matches") or 0)
                      righe = int(payload.get("rows") or 0)
                      tot_partite += partite
                      tot_righe += righe
                      tot_errori += len(errori)
                      parti.append(
                          f"{esito['league']}/{nome}: scritto={payload.get('written')} "
                          f"partite={partite} righe={righe} "
                          f"secondi={payload.get('seconds')} errori={len(errori)}")
              intestazione = (f"acquisizione -> sample={sample} "
                              f"leghe={len(dati.get('leagues', []))} "
                              f"partite={tot_partite} righe={tot_righe} errori={tot_errori}")
              print("::notice::" + (intestazione + " || " + " | ".join(parti))[:900])

          referto = os.path.join(reports, "ppda_deep_player_feasibility.md")
          if os.path.exists(referto):
              with open(referto, encoding="utf-8") as fh:
                  testo = " ".join(l.strip() for l in fh if l.strip())
              print("::notice::referto (inizio) -> " + testo[:900])
          else:
              print("::notice::referto -> assente (ppda_deep_player_feasibility.md non prodotto)")
          PY

      # 3. Prova che i dati e i report committati non sono stati toccati.
      - name: Nessuna modifica ai file committati
        if: always()
        run: |
          if ! git diff --exit-code -- SoccerMath/database audit/results; then
            echo "::error::la modalita' verifica ha modificato file committati"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- SoccerMath/database audit/results)" ]; then
            echo "::error::file nuovi comparsi nelle cartelle dei dati committati"
            git status --porcelain -- SoccerMath/database audit/results
            exit 1
          fi
          echo "Nessun file committato modificato."

      # 4. Referto, report di acquisizione e snapshot acquisito (dati NON
      #    committati: sono l'evidenza della verifica).
      - name: Pubblica referto e snapshot come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppda-player-verify-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ppda-player-out/reports/
            ${{ runner.temp }}/ppda-player-out/database/
          if-no-files-found: warn
          retention-days: 14
