name: TMP probe fonti quote live (DA RIMUOVERE)

# Workflow TEMPORANEO di sola prova: esegue unicamente le chiamate di
# raggiungibilita' (The Odds API + football-data.co.uk fixtures) perche' la
# sandbox di sviluppo non ha rete verso quei domini. Non committa, non pusha,
# non tocca SoccerMath/ e non scrive nel Registro.
# VA RIMOSSO PRIMA DELLA CHIUSURA DELLA PR: il diff finale deve contenere
# solo file sotto audit/.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/edb67158-soccermath2-0

permissions:
  contents: read

concurrency:
  group: tmp-live-odds-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Probe (solo chiamate GET)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROBE_OUT: ${{ github.workspace }}/probe-out

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Probe
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Esito booleano: non espone il valore, solo l'esistenza del secret.
          SECRET_PRESENT: ${{ secrets.ODDS_API_KEY != '' }}
        run: |
          echo "::add-mask::${{ secrets.ODDS_API_KEY }}"
          python audit/live_odds_probe.py --out "$PROBE_OUT"

      - name: Riassunto
        if: always()
        run: |
          echo "secret ODDS_API_KEY presente nel repository: ${{ secrets.ODDS_API_KEY != '' }}"
          if [ -f "$PROBE_OUT/probe_summary.json" ]; then
            python -m json.tool "$PROBE_OUT/probe_summary.json"
          fi

      - name: Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-odds-probe-${{ github.run_id }}
          path: ${{ env.PROBE_OUT }}/
          if-no-files-found: warn
          retention-days: 14
