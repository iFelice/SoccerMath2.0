name: TMP fetch grezzo CSV football-data 2627

# WORKFLOW TEMPORANEO DI SERVIZIO — da rimuovere prima del commit finale.
#
# Serve a un solo scopo: l'ambiente da cui scrivo NON raggiunge
# www.football-data.co.uk (il sandbox blocca l'egress verso quel dominio),
# quindi i 5 CSV grezzi della stagione 2026/27 vengono scaricati qui dentro,
# dove la rete e' libera, e pubblicati come artifact.
#
# Che cosa NON fa, per costruzione:
#   * nessun commit e nessun push (permissions: contents: read);
#   * non scrive dentro SoccerMath/database (output in fd-raw/, non versionata);
#   * nessun segreto;
#   * nessuna elaborazione dei dati: si scaricano i byte grezzi cosi' come
#     arrivano, perche' l'analisi di verifica (punto 1 della commessa) va fatta
#     sui byte esatti, encoding compreso.
#
# Nota operativa: l'ambiente da cui scrivo non puo' leggere i LOG dei run
# (results-receiver.actions.githubusercontent.com non raggiungibile), quindi
# TUTTI i diagnostici vengono scritti dentro fd-raw/ e pubblicati come artifact.

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - '.github/workflows/fd2627_fetch_tmp.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica i 5 CSV grezzi
        run: |
          set -u
          mkdir -p fd-raw
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          : > fd-raw/_fetch_log.txt
          for code in I1 E0 SP1 D1 F1; do
            url="https://www.football-data.co.uk/mmz4281/2627/${code}.csv"
            echo "=== ${code} ===" | tee -a fd-raw/_fetch_log.txt
            echo "url=${url}" | tee -a fd-raw/_fetch_log.txt
            curl -sS -A "$UA" -L \
                 -D "fd-raw/${code}.headers.txt" \
                 -o "fd-raw/${code}.csv" \
                 -w "http_code=%{http_code}\ncontent_type=%{content_type}\nsize_download=%{size_download}\nurl_effective=%{url_effective}\nnum_redirects=%{num_redirects}\n" \
                 "$url" 2> "fd-raw/${code}.curlerr.txt" | tee -a fd-raw/_fetch_log.txt
            echo "curl_exit=$?" | tee -a fd-raw/_fetch_log.txt
            echo "curl_stderr:" | tee -a fd-raw/_fetch_log.txt
            cat "fd-raw/${code}.curlerr.txt" | tee -a fd-raw/_fetch_log.txt
            echo "response_headers:" | tee -a fd-raw/_fetch_log.txt
            tr -d '\r' < "fd-raw/${code}.headers.txt" | tee -a fd-raw/_fetch_log.txt
            size=$(wc -c < "fd-raw/${code}.csv")
            echo "bytes_on_disk=${size}" | tee -a fd-raw/_fetch_log.txt
            echo "first16bytes=$(head -c 16 "fd-raw/${code}.csv" | od -An -tx1 | tr -d ' \n')" | tee -a fd-raw/_fetch_log.txt
            echo "--- prime 3 righe di ${code} ---" >> fd-raw/_fetch_log.txt
            head -n 3 "fd-raw/${code}.csv" | tr -d '\r' >> fd-raw/_fetch_log.txt
            echo "" >> fd-raw/_fetch_log.txt
          done

      - name: Riepilogo
        run: |
          set -u
          : > fd-raw/_summary.txt
          for code in I1 E0 SP1 D1 F1; do
            size=$(wc -c < "fd-raw/${code}.csv")
            lines=$(wc -l < "fd-raw/${code}.csv")
            st=$(grep -m1 -o 'http_code=[0-9]*' fd-raw/_fetch_log.txt >/dev/null 2>&1 && true || true)
            echo "${code} bytes=${size} lines=${lines}" >> fd-raw/_summary.txt
          done
          cat fd-raw/_summary.txt

      - name: Pubblica i CSV grezzi come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fd-2627-raw
          path: fd-raw/
          if-no-files-found: warn
          retention-days: 7
