name: TMP fetch grezzo CSV football-data 2627

# WORKFLOW TEMPORANEO DI SERVIZIO — da rimuovere prima del commit finale.
#
# Serve a un solo scopo: l'ambiente da cui scrivo NON raggiunge
# www.football-data.co.uk (il sandbox blocca l'egress verso quel dominio),
# quindi i 5 CSV grezzi della stagione 2026/27 vengono scaricati qui dentro,
# dove la rete e' libera, e pubblicati come artifact.
#
# Che cosa NON fa, per costruzione:
#   * nessun commit e nessun push (permissions: contents: read);
#   * non scrive dentro SoccerMath/database (output in fd-raw/, non versionata);
#   * nessun segreto;
#   * nessuna elaborazione dei dati: si scaricano i byte grezzi cosi' come
#     arrivano, perche' l'analisi di verifica (punto 1 della commessa) va fatta
#     sui byte esatti, encoding compreso.

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - '.github/workflows/fd2627_fetch_tmp.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica i 5 CSV grezzi
        run: |
          set -u
          mkdir -p fd-raw
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          for code in I1 E0 SP1 D1 F1; do
            url="https://www.football-data.co.uk/mmz4281/2627/${code}.csv"
            code_http=$(curl -sS -A "$UA" -o "fd-raw/${code}.csv" -w "%{http_code}" "$url" || echo "CURL-FAIL")
            size=$(wc -c < "fd-raw/${code}.csv" 2>/dev/null || echo 0)
            lines=$(wc -l < "fd-raw/${code}.csv" 2>/dev/null || echo 0)
            bom=$(head -c 3 "fd-raw/${code}.csv" | od -An -tx1 | tr -d ' \n')
            echo "### ${code} http=${code_http} bytes=${size} lines=${lines} first3bytes=${bom}"
            {
              echo "http_status=${code_http}"
              echo "bytes=${size}"
              echo "lines=${lines}"
              echo "first3bytes=${bom}"
              echo "url=${url}"
            } > "fd-raw/${code}.meta.txt"
          done
          echo "--- contenuto (prime 2 righe, solo come ispezione) ---"
          for code in I1 E0 SP1 D1 F1; do
            echo "== ${code} =="
            head -c 400 "fd-raw/${code}.csv" | tr -d '\r' | head -2
          done

      - name: Verifica che i 5 file non siano vuoti
        run: |
          for code in I1 E0 SP1 D1 F1; do
            size=$(wc -c < "fd-raw/${code}.csv")
            if [ "$size" -lt 200 ]; then
              echo "::error::${code}.csv troppo piccolo (${size} byte): download fallito"
              exit 1
            fi
          done
          echo "5/5 CSV scaricati"

      - name: Pubblica i CSV grezzi come artifact
        uses: actions/upload-artifact@v4
        with:
          name: fd-2627-raw
          path: fd-raw/
          if-no-files-found: error
          retention-days: 7
