name: Quote live (The Odds API)

# Scarica le quote 1X2 dal vivo e scrive SoccerMath/database/live_odds.json,
# l'UNICO file che l'app legge per il Top Mix di mercato. L'app non chiama mai
# The Odds API: la chiave ODDS_API_KEY sta solo qui, nel secret del repository,
# e non viene mai stampata (update_live_odds.py maschera ogni URL e passa ogni
# messaggio di errore da un filtro che sostituisce la chiave con ***).
#
# COSTO: una chiamata per lega, regions=eu, markets=h2h = 1 credito a chiamata,
# 5 crediti a giro (misurato in PR #50, audit/results/live_odds_feasibility.md
# §4). Un giro al giorno sta nel piano gratuito da 500 crediti/mese.
#
# GUARDIA DI FRESCHEZZA (secondo tentativo, 2026-10-10): GitHub ritarda e a
# volte salta i cron (il run del 2026-10-10 del cron 17 8 non e' partito).
# Ora ci sono DUE cron: 17 8 (principale) e 47 10 (secondo tentativo). Prima
# di qualunque chiamata update_live_odds.py legge generato_il del file
# esistente: se ha meno di 6 ore esce 0 senza chiamare l'API (0 crediti,
# log "quote fresche, nessuna chiamata"). Quindi:
#   - primo cron parte      -> giro da 5 crediti, il secondo costa 0;
#   - primo cron salta       -> il secondo fa il giro (5 crediti);
#   - entrambi i cron saltano -> il job allarme di update_database.yml
#     (soglia 26 ore) fa fallire quel workflow e GitHub notifica.
# Consumo atteso: ~5 crediti al giorno. workflow_dispatch ha l'input booleano
# `forza` (default false) che salta la guardia e scarica comunque.
#
# ROBUSTEZZA: se la quota crediti e' esaurita, se la chiave e' rifiutata, se
# nessuna lega torna eventi, oppure se una lega ha eventi ma ZERO libri dopo la
# conversione (guasto del 2026-10-09), il file precedente NON viene sovrascritto
# con dati vuoti (update_live_odds.py esce 1/2/3/4 e il passo fallisce in modo
# visibile).
#
# Trigger:
#   - schedule '17 8 * * *' UTC: tutti i giorni alle 08:17, prima dei kickoff del
#     turno (il primo kickoff osservato nello snapshot di PR #50 era alle 13:00
#     UTC del sabato). Orario nominale: GitHub puo' ritardare i cron;
#   - schedule '47 10 * * *' UTC: secondo tentativo alle 10:47, con guardia di
#     freschezza (0 crediti se il primo cron ha funzionato);
#   - workflow_dispatch: avvio manuale (stesso comando; input `forza` per
#     saltare la guardia, stesso costo);
#   - pull_request: SOLO prove in dry-run con le risposte REALI della sonda
#     (audit/data/live_odds_probe, anche nella forma grezza dell'API ricostruita
#     da audit/live_odds_raw_fixtures.py): nessuna chiamata di rete, 0 crediti,
#     nessun secret necessario, nessuna scrittura. Verificano che il writer
#     converta davvero i bookmaker e che una risposta senza bookmaker faccia
#     fallire il giro invece di sovrascrivere il file buono.

on:
  schedule:
    - cron: '17 8 * * *'
    # Secondo tentativo (2026-10-10): se il cron delle 08:17 non parte, questo
    # recupera il giro. Con il file fresco la guardia esce 0: 0 crediti.
    - cron: '47 10 * * *'
  workflow_dispatch:
    inputs:
      forza:
        description: "Salta la guardia di freschezza e scarica comunque (~5 crediti)"
        type: boolean
        required: false
        default: false
  pull_request:
    branches:
      - main
    paths:
      - 'SoccerMath/update_live_odds.py'
      - 'SoccerMath/market_odds.py'
      - 'SoccerMath/team_aliases.py'
      - 'audit/live_odds_raw_fixtures.py'
      - 'audit/data/live_odds_probe/**'
      - '.github/workflows/live_odds.yml'

permissions:
  contents: write

# Gruppo DEDICATO alle quote (2026-10-10): condividere soccermath-data con
# update_database.yml / update_xg.yml metteva i cron delle quote in coda fra
# workflow diversi, e GitHub CANCELLA ogni run precedentemente in attesa nel
# gruppo non appena ne arriva un'altra (anche con cancel-in-progress: false,
# che protegge solo i run IN CORSO): un giro quote poteva sparire in coda.
# Gruppo proprio: le quote si serializzano solo con le quote. Il commit
# resta protetto dal retry con rebase del passo di push (stesso sistema di
# update_database.yml e update_xg.yml, che restano in soccermath-data).
concurrency:
  group: soccermath-quote
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # Prova offline sulla PR: writer reale, risposta API simulata, 0 crediti.
  # -------------------------------------------------------------------------
  dry-run:
    name: Dry-run con risposta API simulata (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Dipendenze (solo requests: il writer non importa streamlit)"
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # Le risposte REALI della sonda rimesse nella forma GREZZA dell'API
      # (bookmakers[].markets[].outcomes[]): e' la forma che arriva dalla rete.
      # Il dry-run sulla sola forma compattata passava anche il 2026-10-09,
      # quando la conversione buttava TUTTI i bookmaker.
      - name: Risposte reali della sonda in forma grezza (0 crediti)
        run: |
          python audit/live_odds_raw_fixtures.py --out /tmp/odds_grezze
          python audit/live_odds_raw_fixtures.py --out /tmp/odds_senza_bookmakers \
            --senza-bookmakers

      - name: Dry-run sulle risposte reali grezze (nessuna rete, nessuna scrittura)
        working-directory: SoccerMath
        run: |
          set -o pipefail
          python update_live_odds.py \
            --fixture /tmp/odds_grezze \
            --out /tmp/live_odds_dryrun.json \
            --dry-run 2>&1 | tee /tmp/live_odds_dryrun.log
          # Le quote devono esserci: "eventi con almeno un libro=0" significa
          # che la conversione ha perso i bookmaker (guasto del 2026-10-09).
          if grep -q 'eventi con almeno un libro=0' /tmp/live_odds_dryrun.log; then
            echo "::error::la conversione ha perso i bookmaker della risposta reale"
            exit 1
          fi

      - name: Dry-run sugli snapshot compattati della sonda
        working-directory: SoccerMath
        run: |
          set -o pipefail
          python update_live_odds.py \
            --fixture ../audit/data/live_odds_probe \
            --out /tmp/live_odds_dryrun_compattato.json \
            --dry-run 2>&1 | tee -a /tmp/live_odds_dryrun.log

      # Prova del guasto: stessi eventi, zero bookmaker. Il writer DEVE uscire 4
      # e non scrivere: un file senza quote non deve mai sostituire quello buono.
      - name: Risposta con bookmakers vuoti -> errore e file precedente intatto
        working-directory: SoccerMath
        run: |
          set -o pipefail
          echo '{"leghe": {"Serie A": {"n_eventi": 3, "eventi": [1, 2, 3]}}}' \
            > /tmp/live_odds_precedente.json
          PRIMA=$(sha256sum /tmp/live_odds_precedente.json | cut -d' ' -f1)
          set +e
          python update_live_odds.py \
            --fixture /tmp/odds_senza_bookmakers \
            --out /tmp/live_odds_precedente.json 2>&1 | tee /tmp/live_odds_vuote.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" != "4" ]; then
            echo "::error::atteso exit 4 con bookmakers vuoti, ottenuto $rc"
            exit 1
          fi
          DOPO=$(sha256sum /tmp/live_odds_precedente.json | cut -d' ' -f1)
          if [ "$PRIMA" != "$DOPO" ]; then
            echo "::error::il file precedente e' stato sovrascritto con dati senza quote"
            exit 1
          fi
          echo "OK: exit 4 e file precedente intatto."

      - name: Nessuna chiave nei log del dry-run
        run: |
          # La chiave NON deve comparire in nessun output (qui non e' nemmeno
          # definita: la guardia resta, cosi' il passo ha senso anche se un
          # giorno qualcuno la passa per errore).
          if grep -qi 'apiKey=[A-Za-z0-9]\{8,\}' /tmp/live_odds_dryrun.log; then
            echo "::error::una chiave non mascherata e' finita nel log"
            exit 1
          fi
          echo "OK: dry-run completata senza scrivere e senza stampare chiavi."

  # -------------------------------------------------------------------------
  # Giro reale (cron + avvio manuale): scrive e committa live_odds.json.
  # -------------------------------------------------------------------------
  scarica:
    name: Scarica quote e aggiorna live_odds.json
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # Esistenza del secret SENZA leggerne il valore: il test e' una
      # disuguaglianza valutata dal runner, il valore non arriva mai nel log.
      - name: Verifica ODDS_API_KEY (senza stamparla)
        env:
          CHIAVE: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$CHIAVE" ]; then
            echo "::error::ODDS_API_KEY mancante. Aggiungila in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "ODDS_API_KEY presente (valore non letto, non stampato)."

      - name: Scarica le quote (una chiamata per lega, regions=eu, markets=h2h)
        working-directory: SoccerMath
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        # Niente `set -e` sulla chiamata: il codice di uscita va letto e
        # spiegato. 0 = scritto OPPURE quote fresche (guardia: nessuna
        # chiamata, 0 crediti); 1 = nessun evento (file precedente conservato);
        # 2 = quota crediti esaurita (file precedente conservato); 3 = chiave;
        # 4 = una lega ha eventi ma zero libri dopo la conversione (file
        # precedente conservato: senza quote il Top Mix di mercato e' vuoto).
        run: |
          set +e
          # Input `forza` di workflow_dispatch (default false): salta la guardia
          # di freschezza. Su schedule e pull_request l'input non esiste e la
          # guardia resta attiva.
          ARGS=""
          if [ "${{ inputs.forza }}" = "true" ]; then
            ARGS="--forza"
            echo "forza=true: guardia di freschezza saltata su richiesta."
          fi
          python update_live_odds.py $ARGS 2>&1 | tee /tmp/live_odds.log
          rc=${PIPESTATUS[0]}
          set -e
          # I crediti residui sono nel log (sono header pubblici della risposta),
          # la chiave no: ripubblicati come annotazioni per leggerli senza
          # scaricare artifact.
          grep -E '^(INFO|WARNING|ERROR)' /tmp/live_odds.log | tail -n 12 | while IFS= read -r line; do
            echo "::warning title=quote-live::${line:0:900}"
          done || true
          case "$rc" in
            0)
              if grep -q 'quote fresche, nessuna chiamata' /tmp/live_odds.log; then
                echo "Quote gia' fresche (guardia 6h): nessuna chiamata, 0 crediti spesi."
              else
                echo "Quote scaricate."
              fi ;;
            1) echo "::error::nessun evento da nessuna lega: live_odds.json NON sovrascritto" ;;
            2) echo "::error::quota crediti esaurita: live_odds.json NON sovrascritto" ;;
            3) echo "::error::ODDS_API_KEY assente o rifiutata: live_odds.json NON sovrascritto" ;;
            4) echo "::error::eventi senza quote dopo la conversione: live_odds.json NON sovrascritto" ;;
            *) echo "::error::update_live_odds.py uscito con $rc" ;;
          esac
          exit "$rc"

      - name: Nessuna chiave nel file scritto
        working-directory: SoccerMath
        env:
          CHIAVE: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ ! -f database/live_odds.json ]; then
            echo "live_odds.json assente (il giro non ha scritto): niente da controllare."
            exit 0
          fi
          if [ -n "$CHIAVE" ] && grep -qF "$CHIAVE" database/live_odds.json; then
            echo "::error::la chiave compare in live_odds.json"
            exit 1
          fi
          echo "OK: nessuna chiave nel file."

      - name: Commit e push (con retry se il branch si muove)
        run: |
          set -uo pipefail
          BRANCH="${{ github.ref_name }}"
          git config --global user.name "M4 Bot"
          git config --global user.email "action@github.com"
          git add -A -- 'SoccerMath/database/live_odds.json'
          if git diff --cached --quiet; then
            echo "Nessun cambiamento: niente da committare."
            exit 0
          fi
          git commit -m "Auto-update quote live $(date -u +%Y-%m-%dT%H:%M)Z"
          for i in 1 2 3 4; do
            if git push -q origin "HEAD:$BRANCH"; then
              echo "Push ok."
              exit 0
            fi
            echo "Push rifiutato ($BRANCH avanti): rebase e riprovo ($i/4)"
            git fetch -q origin "$BRANCH"
            if ! git rebase -q "origin/$BRANCH"; then
              git rebase --abort
              echo "::error::Conflitto su live_odds.json, serve intervento manuale"
              exit 1
            fi
            sleep $((i * 8))
          done
          echo "::error::Push non riuscito dopo 4 tentativi"
          exit 1
