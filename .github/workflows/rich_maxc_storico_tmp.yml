name: "TEMP - download CSV football-data storici (MaxC* vs B365C*)"

# WORKFLOW TEMPORANEO di solo DOWNLOAD (schema gia' usato per rich_2627):
# la sandbox non raggiunge football-data.co.uk e non puo' scaricare artifact,
# quindi i byte grezzi (nessuna trasformazione) vengono COMMITTATI sul branch
# della sessione. Il file viene RIMOSSO prima del commit definitivo.
#
# Nessun segreto usato (solo GITHUB_TOKEN per il push dei byte scaricati).

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - '.github/workflows/rich_maxc_storico_tmp.yml'

permissions:
  contents: write

concurrency:
  group: rich-maxc-storico-tmp
  cancel-in-progress: true

env:
  BRANCH: arena/01a0b9d3-soccermath2-0

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout del branch della sessione
        uses: actions/checkout@v4
        with:
          ref: arena/01a0b9d3-soccermath2-0
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download byte grezzi (5 leghe x 5 stagioni, incl. 2627 per il baseline)
        shell: python
        run: |
          import hashlib
          import io
          import json
          import os
          import time
          import urllib.request

          OUT = os.path.join("audit", "data")
          os.makedirs(OUT, exist_ok=True)

          # 4 stagioni storiche del perimetro walk-forward + 2627 (baseline
          # 2.22%/5.49% gia' misurato solo li': ricalcolato con la STESSA metrica).
          SEASONS = ["2223", "2324", "2425", "2526", "2627"]
          DIVS = {
              "E0": "england-premier-league",
              "D1": "germany-bundesliga",
              "I1": "italy-serie-a",
              "SP1": "spain-laliga",
              "F1": "france-ligue-1",
          }

          diag = []
          missing = []
          for season in SEASONS:
              for div, league in DIVS.items():
                  url = f"https://www.football-data.co.uk/mmz4281/{season}/{div}.csv"
                  name = f"fd_{div}_{season}.csv"
                  entry = {"file": name, "url": url, "league": league, "season": season}
                  for attempt in range(1, 7):
                      try:
                          req = urllib.request.Request(
                              url,
                              headers={
                                  "User-Agent": (
                                      "Mozilla/5.0 (X11; Linux x86_64) "
                                      "AppleWebKit/537.36 (KHTML, like Gecko) "
                                      "Chrome/124.0 Safari/537.36"
                                  ),
                                  "Accept": "text/csv,*/*",
                                  "Accept-Encoding": "identity",
                              },
                          )
                          with urllib.request.urlopen(req, timeout=60) as resp:
                              raw = resp.read()
                          if not raw:
                              raise RuntimeError("corpo vuoto")
                          entry["http_bytes"] = len(raw)
                          entry["sha256"] = hashlib.sha256(raw).hexdigest()
                          # BOM utf-8 possibile su alcuni file: gestito, non errore.
                          body = raw
                          entry["bom"] = body[:3] == b"\xef\xbb\xbf"
                          if entry["bom"]:
                              body = body[3:]
                          first = body.split(b"\n", 1)[0]
                          entry["first_line"] = first[:120].decode("latin-1", "replace")
                          if not first.decode("latin-1", "replace").upper().startswith("DIV"):
                              raise RuntimeError(f"header inatteso: {entry['first_line']!r}")
                          with io.open(os.path.join(OUT, name), "wb") as f:
                              f.write(raw)
                          entry["ok"] = True
                          print(f"ok {name}: {len(raw)} bytes bom={entry['bom']} "
                                f"sha256={entry['sha256'][:12]}")
                          break
                      except Exception as exc:  # noqa: BLE001
                          entry["ok"] = False
                          entry["error"] = f"{type(exc).__name__}: {exc}"
                          print(f"retry {attempt}/6 {name}: {entry['error']}")
                          time.sleep(4 * attempt)
                  if not entry.get("ok"):
                      missing.append(name)
                  diag.append(entry)

          with io.open(os.path.join(OUT, "fd_maxc_storico_manifest.json"), "w",
                       encoding="utf-8") as f:
              json.dump(diag, f, ensure_ascii=False, indent=2)
              f.write("\n")

          ok = [d for d in diag if d.get("ok")]
          tot = sum(d["http_bytes"] for d in ok)
          print(f"SCARICATI {len(ok)}/{len(diag)} file, {tot} bytes; mancanti: {missing}")
          if missing:
              raise SystemExit(f"DOWNLOAD FALLITO per: {missing}")

      - name: Commit e push dei byte grezzi sul branch della sessione
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add audit/data/fd_*.csv audit/data/fd_maxc_storico_manifest.json
          git commit -m "TEMP: byte grezzi CSV football-data 2223-2627 x 5 leghe per audit MaxC* vs B365C*" || echo "nulla da committare"
          git push origin HEAD:"$BRANCH"
