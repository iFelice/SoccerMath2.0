name: Aggiorna Database

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# una run alla volta: due push contemporanei sui Live.csv andrebbero in conflitto
concurrency:
  group: update-database
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SoccerMath

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fallisce subito (e in modo leggibile) se la chiave non e' configurata:
      # senza questo controllo update_db.py stampa un warning e chiude con 0,
      # quindi l'action resta verde senza aggiornare nulla.
      - name: Check API key
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          if [ -z "$FOOTBALL_DATA_API_KEY" ]; then
            echo "::error::FOOTBALL_DATA_API_KEY non presente tra i Secrets del repo (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          echo "FOOTBALL_DATA_API_KEY configurata ($(printf '%s' "$FOOTBALL_DATA_API_KEY" | wc -c) caratteri)."

      - name: Update live database
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          set -o pipefail   # senza, l'exit code di python verrebbe mascherato da tee
          python update_db.py | tee -a "$GITHUB_STEP_SUMMARY"

      # Understat blocca spesso gli IP dei runner: il passo resta tollerante,
      # ma ora viene eseguito (senza di questo i database/xg_*.json invecchiano
      # per sempre e l'app usa xG di stagioni passate).
      - name: Update xG (Understat)
        continue-on-error: true
        run: |
          set -o pipefail
          python update_xg.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update live data"
          # i pattern sono relativi alla root del repo ( gli step 'uses' non
          # ereditano defaults.run.working-directory )
          file_pattern: "SoccerMath/database/*_Live.csv SoccerMath/database/xg_*.json"
          status_options: "--untracked-files=no"
